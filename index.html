<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>인형뽑기 고수인 내가 최고 랭크 사장이 되어보려고 합니다</title>
<style>
  @font-face {
    font-family: 'Game';
    src: url('assets/fonts/game.woff2') format('woff2');
    font-display: block;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f8fc; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Game', sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: manipulation; }
  #nameInput {
    display: none; position: absolute; box-sizing: border-box; padding: 0 12px; text-align: center;
    font-family: 'Game', sans-serif; color: #14324d; background: #ffffff;
    border: 3px solid #14324d; border-radius: 0; outline: none;
    box-shadow: inset 0 3px 0 #e4eff8;
  }
  #nameInput:focus { border-color: #2f80d0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="576"></canvas>
  <input id="nameInput" type="text" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="이름 입력">
</div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/balance.js"></script>
<script src="js/sim.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/scene.js"></script>
<script src="js/cutscene.js"></script>
<script src="js/shopview.js"></script>
<script src="js/actors.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
